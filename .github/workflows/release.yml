name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-release-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-release-

      - name: Install dependencies
        run: mix deps.get

      # Same gate as `mix precommit`, but with --check-formatted instead
      # of `format` so drift fails the release rather than silently
      # rewriting files in CI.
      - name: Run quality gate
        env:
          MIX_ENV: test
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix credo --strict
          mix sobelow
          mix test
          mix dialyzer

      # Runs in the default :dev env so ex_doc (a dev-only dep) is
      # available for the docs half of the publish.
      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
